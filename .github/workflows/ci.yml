name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l -s .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: The following Go files are not formatted according to gofmt style:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run 'gofmt -w -s .' or 'make fmt' locally and commit the changes."
            exit 1
          fi

      - name: Verify Go Module Tidy (go mod tidy)
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "Error: go.mod or go.sum is out of sync."
            echo "Run 'go mod tidy' locally and commit the changes."
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Run Tests with Race Detector and Coverage
        id: run-tests
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Publish Test Coverage to Step Summary
        if: always() && steps.run-tests.outcome == 'success'
        run: |
          echo "## 📊 Unit Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TOTAL_COV=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}')
          echo "**Total Statement Coverage:** \`$TOTAL_COV\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Click to view per-function coverage details</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Report Artifact
        if: always() && steps.run-tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Compile Bot Binary
        run: |
          mkdir -p build
          go build -v -ldflags="-s -w" -o build/bot ./cmd/main.go

      - name: Compile Deploy Tool
        run: |
          go build -v -ldflags="-s -w" -o build/deploy ./cmd/deploy/main.go

      - name: Compile All Packages
        run: |
          go build -v ./...

      - name: Verify Binaries
        run: |
          test -x build/bot
          test -x build/deploy
          echo "Bot and Deploy binaries successfully compiled and verified."
